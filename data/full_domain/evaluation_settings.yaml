protocol:
  name: full_domain_evidence_guided_revision_out_of_sample_confirmation
  version: 3.0.0
  status: registered_before_execution
  registered_at: '2026-09-11'
  research_question: With fresh hybrid PySR and fit-feedback LLM candidates, unseen
    data seeds, and the complete declared observation domain, does ambiguity-gated
    predictive-disagreement acquisition improve the selected explicit correction relative
    to the identical candidate portfolio without new observations?
methods:
- no_acquisition
- conditional_space_filling
- evidence_guided_predictive_disagreement
