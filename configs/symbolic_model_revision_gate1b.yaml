protocol:
  name: symbolic_model_revision_gate1b_active_discrimination
  version: 0.2.0
  status: development_pilot

gate1_config: configs/symbolic_model_revision_gate1.yaml
data_seed: 20260806

candidate_archive:
  control_run_id: gate1a_lt_stability_v1
  feedback_run_id: gate1a_fit_feedback_incumbent_v2
  source_data_seed: 20260806
  arms: [independent_resampling, fit_feedback]
  task_ids: [T04, T06]
  maximum_structures_per_task: 8
  ranking_criterion: observed_validation_selection_score
  allow_new_llm_calls: false

design:
  initial_observation_mode: all_source_fit
  acquisition_pool_count: 192
  maximum_new_observations: 8
  outer_shell_only: true
  repetitions: 3
  strategies:
    - space_filling_design
    - random_design
    - predictive_disagreement
    - expected_information_gain

model_evidence:
  weight_criterion: bayesian_information_criterion
  bic_complexity: fitted_parameter_count
  retain_baseline_null_model: true

expected_information_gain:
  estimator: gauss_hermite_scalar_gaussian
  quadrature_order: 32

random_design:
  seed_offset: 92000

evaluation:
  recovery_noise_multiplier: 3.0
  primary_budget: 8
  report_budgets: [0, 1, 2, 4, 8]

study:
  development_only: true
  primary_success_contract: >-
    At the frozen primary budget, at least one adaptive strategy must reduce
    mean locked RMSE relative to both random and space-filling designs without
    reducing the total behavior-recovery count.
  prohibited_adaptations:
    - Regenerate candidate structures.
    - Expose acquisition-pool targets before a point is selected.
    - Use locked responses for fitting, weighting, acquisition, or selection.
    - Change budgets or candidate count after inspecting results.
